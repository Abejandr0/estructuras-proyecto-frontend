services:
  db:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: aiverse
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?Set MONGO_PASSWORD in .env}
    volumes:
      - aiverse-db:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\""]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:27017:27017"
  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4179
      ENABLE_SHARED_REPOSITORY_API: "true"
      MONGODB_URI: mongodb://aiverse:${MONGO_PASSWORD}@db:27017/aiverse?authSource=admin
      MINIGIT_REPO: /srv/aiverse
      AI_PROVIDER: gemini
      AI_ALLOW_NETWORK: ${AI_ALLOW_NETWORK:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
    volumes:
      - aiverse-repositories:/srv/aiverse
    ports:
      - "127.0.0.1:4179:4179"
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4179}
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "127.0.0.1:5173:80"
volumes:
  aiverse-db:
  aiverse-repositories:
