<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" />
    <script>
      (() => {
        const root = document.documentElement;
        let preference = 'system';
        try {
          const saved = localStorage.getItem('theme') || localStorage.getItem('aiverse-theme');
          if (saved === 'system' || saved === 'light' || saved === 'dark') preference = saved;
        } catch {}
        const dark = preference === 'dark' || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        root.dataset.theme = dark ? 'dark' : 'light';
        root.dataset.themePreference = preference;
        root.style.colorScheme = dark ? 'dark' : 'light';
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.content = dark ? '#1c1d29' : '#fbfaf7';
      })();
    </script>
    <meta name="description" content="Versionamiento claro, colaboración de equipo y asistencia de IA bajo tu control." />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="AIVerse" />
    <meta property="og:title" content="AIVerse — Tu código avanza. Tu equipo entiende por qué." />
    <meta property="og:description" content="Versionamiento claro, colaboración de equipo y asistencia de IA bajo tu control." />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AIVerse — Tu código avanza. Tu equipo entiende por qué.</title>

      {"@context":"https://schema.org","@type":"SoftwareApplication","name":"AIVerse","applicationCategory":"DeveloperApplication","operatingSystem":"Web","inLanguage":"es","description":"Versionamiento claro, colaboración de equipo y asistencia de IA bajo tu control."}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
